name: Deploy to Staging

# Runs automatically on every push to dev (i.e. every merged PR).
# Deploys: Supabase staging migrations → Railway staging (api + worker) →
# Vercel staging (all four web apps).

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'

jobs:
  ci-checks:
    name: Run CI checks before deploying
    uses: ./.github/workflows/ci.yml

  migrate-database:
    name: Apply Supabase migrations (staging)
    needs: ci-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to staging project
        run: supabase link --project-ref "$SUPABASE_STAGING_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

  deploy-backend:
    name: Deploy API + Worker to Railway (staging)
    needs: migrate-database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service
        run: railway up --service api --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy Worker service
        run: railway up --service worker --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  deploy-web-apps:
    name: Deploy Web Apps to Vercel (staging)
    needs: migrate-database
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [pwa, web-business, web-platform, web-customer]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy ${{ matrix.app }} to Vercel staging
        working-directory: apps/${{ matrix.app }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  notify:
    name: Notify deployment result
    needs: [deploy-backend, deploy-web-apps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.deploy-backend.result }}" = "success" ] && [ "${{ needs.deploy-web-apps.result }}" = "success" ]; then
            echo "✅ Staging deployment succeeded."
          else
            echo "❌ Staging deployment failed. Check the job logs above."
            exit 1
          fi
