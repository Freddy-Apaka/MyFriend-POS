name: CI

# Runs on every pull request targeting dev or main.
# This is the PR gate — nothing merges unless every step below passes.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'

jobs:
  lint-and-test:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test -- --coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage'
          retention-days: 7
          if-no-files-found: ignore

  migration-dry-run:
    name: Database Migration Dry-Run
    runs-on: ubuntu-latest
    # Only meaningful once supabase/migrations/ has real migration files
    # (starting M2). Safe to run as a no-op before that.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check for migration files
        id: check-migrations
        run: |
          if [ -z "$(find supabase/migrations -name '*.sql' 2>/dev/null)" ]; then
            echo "no_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate migrations (dry run against local Supabase)
        if: steps.check-migrations.outputs.no_migrations == 'false'
        run: |
          supabase db start
          supabase migration up --local
          supabase db diff --local --schema public
          supabase stop

      - name: Skip — no migrations yet
        if: steps.check-migrations.outputs.no_migrations == 'true'
        run: echo "No migration files found yet. Skipping dry-run."
